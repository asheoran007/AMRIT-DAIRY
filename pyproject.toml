[project]
name = "amrit-adapter"
version = "0.1.0"
description = "Minimal event-inbox / outbox adapter between commerce, payment, shipping providers and BiteSpeed for Amrit Dairy. Dry-run by default; no live sends until the BiteSpeed API contract is verified."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "sqlalchemy==2.0.40",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "httpx==0.28.1",
  "shapely==2.1.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
