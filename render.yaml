# Render Blueprint — single web service with the worker embedded + 1 GB persistent disk (SQLite). Lowest-cost Render layout.
# Repository root = this folder (adapter/). Deploy: Render dashboard -> New -> Blueprint -> select the repo containing this file -> fill secret env vars -> Apply.
# Then: Settings -> Custom Domains -> adapter.amritdairy.in (Render issues TLS) and add the CNAME at GoDaddy.
services:
  - type: web
    name: amrit-adapter
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: starter            # paid plan required for a persistent disk and no spin-down
    region: singapore        # closest Render region to India
    healthCheckPath: /health
    domains:
      - adapter.amritdairy.in   # CNAME adapter -> amrit-adapter.onrender.com at GoDaddy; Render issues the TLS cert
    autoDeploy: false        # deploy only when the owner clicks Deploy (change control)
    disk:
      name: adapter-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADAPTER_DATABASE_URL
        value: sqlite:////data/adapter.db
      - key: ADAPTER_EMBED_WORKER
        value: "true"
      - key: RELEASE               # bump per release: the Blueprint sync applies the env change and redeploys the latest commit
        value: "2026-10-16.5"
      - key: ADAPTER_BRAND_ID
        value: amrit_dairy
      - key: SHOPIFY_SHOP_DOMAIN
        value: kmaz1y-dq.myshopify.com
      - key: ADAPTER_PUBLIC_URL
        value: https://adapter.amritdairy.in
      - key: SENDER_MODE
        value: dry_run            # dry_run | live_test (TEST_PHONE_ALLOWLIST only) | live
      - key: CHATWOOT_API_TOKEN   # support console (chat.bitespeed.co) agent access token ONLY; set in dashboard. Never the Messaging API key.
        sync: false
      - key: BITESPEED_API_KEY    # official shop-scoped BiteSpeed Messaging API key (X-API-Key); set in dashboard only
        sync: false
      - key: BITESPEED_CHANNEL_ID # store WhatsApp number as digits (doc: "in most cases same as phone number"); marketing.bitespeed.co -> Settings -> WhatsApp
        value: "917700004877"
      - key: FLOW_KEYWORDS_YIELD   # exact trigger words of live flows AD-01 (ghee) / AD-02 (honey) / AD-08 (milk), read 13 Oct; clear at go-live
        value: "ghee,घी,ghi,bilona,बिलोना,desi ghee,cow ghee,golden ghee,honey,शहद,हनी,shehad,natural honey,organic honey,raw honey,honey price,buy honey,milk,दूध,dudh,cow milk,desi cow milk,a2 milk,milk price"
      - key: GLOBAL_KILL_SWITCH
        value: "true"
      - key: TEST_PHONE_ALLOWLIST
        value: "+918814869007"
      - key: SHOPIFY_CLIENT_ID
        sync: false          # entered in the dashboard, never in the repo
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: INBOX_WEBHOOK_TOKEN
        generateValue: true
