# Permanent deployment: API + worker + Caddy (automatic HTTPS). Needs: a VPS with ports 80/443 open and a DNS A record
# (e.g. adapter.amritdairy.in) pointing at it. Secrets live only in ../.env (never committed).
services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment: { ADAPTER_DATABASE_URL: "sqlite:////data/adapter.db" }
    volumes: [ "adapter-data:/data" ]
    restart: unless-stopped
    expose: [ "8787" ]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment: { ADAPTER_DATABASE_URL: "sqlite:////data/adapter.db" }
    volumes: [ "adapter-data:/data" ]
    command: ["python", "-m", "amrit_adapter.worker", "--loop", "20"]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    depends_on: [ api ]
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    # ADAPTER_HOST is read by Caddy from deploy/.env.caddy (env_file) — NOT via compose ${...} interpolation, which only sees the
    # shell and the .env next to this file and would fail with "variable is not set".
    env_file: .env.caddy
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config" ]
    depends_on: [ api ]
volumes: { adapter-data: {}, caddy-data: {}, caddy-config: {} }
